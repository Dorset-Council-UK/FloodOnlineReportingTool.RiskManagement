# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy - fort-dorset-riskmanager

on:
  release:
      types: [released]

permissions: 
  contents: read

jobs:
  build:
    if: github.event_name == 'release' && github.event.action == 'released' && github.event.release.prerelease == false && endsWith(github.event.release.tag_name, '-dorset')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4

      - run: npm ci
        working-directory: ./FloodOnlineReportingTool.RiskManagement

      - run: npm run build
        working-directory: ./FloodOnlineReportingTool.RiskManagement

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - name: dotnet publish
        run: >
          dotnet publish
          FloodOnlineReportingTool.RiskManagement/FloodOnlineReportingTool.RiskManagement.csproj
          --configuration Release
          --no-build
          --output "${{ env.DOTNET_ROOT }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment: production

    permissions: 
      contents: read
      id-token: write
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fort-dorset-riskmanager'
          package: .
