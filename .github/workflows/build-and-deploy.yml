# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy to Azure

on:
  release:
      types: [released]

permissions: 
  contents: read

jobs:
  build:
    if: github.event_name == 'release' && github.event.action == 'released' && github.event.release.prerelease == false && endsWith(github.event.release.tag_name, '-dorset')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4

      - run: npm ci
        working-directory: ./FloodOnlineReportingTool.RiskManagement

      - run: npm run build
        working-directory: ./FloodOnlineReportingTool.RiskManagement

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - name: Run solution tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: dotnet publish
        run: >
          dotnet publish
          FloodOnlineReportingTool.RiskManagement/FloodOnlineReportingTool.RiskManagement.csproj
          --configuration Release
          --no-build
          --output "${{ env.DOTNET_ROOT }}/myapp"

      - name: Publish Messaging as a continuous WebJob
        shell: bash
        run: |
          job_dir="$DOTNET_ROOT/myapp/App_Data/jobs/continuous/messaging"
          dotnet publish Messaging/Messaging.csproj \
            --configuration Release --no-build -p:UseAppHost=false --output "$job_dir"
          printf '%s\r\n' '@echo off' 'cd /d "%~dp0"' 'dotnet Messaging.dll' > "$job_dir/run.cmd"
          printf '%s\n' '{"is_singleton": true}' > "$job_dir/settings.job"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment: production
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    permissions: 
      contents: read
      id-token: write
    
    steps:
      - name: Validate resource configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_RESOURCE_GROUP)) {
            throw 'Set the AZURE_RESOURCE_GROUP variable in the production GitHub environment.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_NAME)) {
            throw 'Set the AZURE_WEBAPP_NAME variable in the production GitHub environment.'
          }
    
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Restart Azure Web App
        shell: pwsh
        run: az webapp restart --name "$env:AZURE_WEBAPP_NAME" --resource-group "$env:AZURE_RESOURCE_GROUP"
