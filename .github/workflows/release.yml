name: CI/CD - Release Candidate Deployment

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  trigger-azure-pipeline:
    if: startsWith(github.event.release.tag_name, 'v') && endsWith(github.event.release.tag_name, '.*-rc[0-9]+$')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Azure DevOps Pipeline
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic ${{ secrets.AZURE_DEVOPS_PAT }}" \
            https://dev.azure.com/DorsetCouncilDevOps/Flood%20Reporting%20Tool%20-%20Risk%20Management/_apis/pipelines/29/runs?api-version=7.0 \
            -d '{
              "resources": {
                "repositories": {
                  "self": {
                    "refName": "refs/tags/${{ github.event.release.tag_name }}"
                  }
                }
              }
            }'
