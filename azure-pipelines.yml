trigger:
  tags:
    include:
      - v* # Run on all tags starting with 'v'
pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: git
      name: "Web Development/Pipelines"

jobs:
  - template: build/dotnet.yml@templates
    parameters:
      prebuildSteps:
        - task: Npm@1
          inputs:
            command: "install"
            workingDir: "FloodOnlineReportingTool.RiskManagement"
        - task: Npm@1
          displayName: "Webpack Build (prod)"
          inputs:
            command: "custom"
            customCommand: "run build"
            workingDir: "FloodOnlineReportingTool.RiskManagement"

  - job: VariableSubstitution
    displayName: "Insert local variables into appsettings.json"
    variables:
    - group: fort-staging-properties
    steps:
      - task: FileTransform@2
        displayName: "Insert local variables into appsettings.json"
        inputs:
          folderPath: '$(Pipeline.Workspace)/'
          jsonTargetFiles: '**/appsettings.json'

  - template: deploy/iis.yml@templates
    parameters:
      environment: "staging"
      websiteName: "gi-staging"
      virtualApplication: "floodriskmanagement"
      variableGroup: "PipelineSettings"
      projectName: "FloodOnlineReportingTool.RiskManagement"
      dependsOn: build
        

        
