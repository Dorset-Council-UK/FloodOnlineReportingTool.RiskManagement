trigger:
  tags:
    include:
      - v* # Run on all tags starting with 'v'
pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: git
      name: "Web Development/Pipelines"
      ref: refs/heads/feature-updated-artifacts
  
jobs:
  - template: build/dotnet.yml@templates
    parameters:
      prebuildSteps:
        - task: Npm@1
          inputs:
            command: "install"
            workingDir: "FloodOnlineReportingTool.RiskManagement"
        - task: Npm@1
          displayName: "Webpack Build (prod)"
          inputs:
            command: "custom"
            customCommand: "run build"
            workingDir: "FloodOnlineReportingTool.RiskManagement"

  - template: deploy/iis.yml@templates
    parameters:
      environment: "staging"
      websiteName: "gi-staging"
      virtualApplication: "floodriskmanagement"
      variableGroup: "PipelineSettings"
      artifactDownload: "updated-config"
      projectName: "FloodOnlineReportingTool.RiskManagement"
      dependsOn: VariableSubstitution
   
