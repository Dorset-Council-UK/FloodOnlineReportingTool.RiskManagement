# Use a GitHub release with tag to publish to an environment via Continuous Integration. 
#trigger:
#  tags:
#    include:
#      - ^v.*-rc\d+$ # Run on all tags starting with 'v' and ending with release candidate 'rc1', 'rc2' etc
#pr:
#  branches:
#    include:
#      - main

resources:
  repositories:
    - repository: templates
      type: git
      name: "Web Development/Pipelines"
      ref: refs/heads/main
jobs:
  - template: build/dotnet.yml@templates
    parameters:
      prebuildSteps:
        - task: Npm@1
          inputs:
            command: "install"
            workingDir: "FloodOnlineReportingTool.RiskManagement"
        - task: Npm@1
          displayName: "Webpack Build (prod)"
          inputs:
            command: "custom"
            customCommand: "run build"
            workingDir: "FloodOnlineReportingTool.RiskManagement"

  - template: deploy/iis.yml@templates
    parameters:
      environment: "staging"
      websiteName: "gi-staging"
      virtualApplication: "floodriskmanagement"
      variableGroups: 
        - "fort-staging-properties"
      projectName: "FloodOnlineReportingTool.RiskManagement"
      dependsOn: build